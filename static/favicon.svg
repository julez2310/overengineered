<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"></stop>
      <stop offset="1" stop-color="#22c55e"></stop>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="216" height="216" rx="48" fill="#0b1220" stroke="#1f2937" stroke-width="4"></rect>

  <!-- Accent ring -->
  <path d="M128 38
           a90 90 0 1 1 0 180
           a90 90 0 1 1 0 -180" fill="none" stroke="url(#g)" stroke-width="10" opacity="0.9"></path>

  <!-- OE letters -->
  <g filter="url(#s)">
    <text x="128" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="92" font-weight="900" letter-spacing="-6" fill="#e7eef7">OE</text>
  </g>

  <!-- Tiny bolt for meme energy -->
  <path d="M164 78 L142 122 H162 L136 178 L150 130 H130 Z" fill="url(#g)" opacity="0.95"></path>
</svg>