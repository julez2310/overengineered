<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>

  <script src="/static/content.js"></script>

  <style>
    :root{
      --bg:#0b0f14; --panel:#0f172a; --border:#1f2937;
      --text:#e7eef7; --muted:rgba(231,238,247,.72);
    }
    body{ margin:0; background:var(--bg); color:var(--text);
          font-family: ui-sans-serif, system-ui; }
    .container{ max-width:1000px; margin:auto; padding:20px; padding-bottom:90px;}
    .card{ background:var(--panel); border:1px solid var(--border);
           border-radius:16px; padding:16px; margin-bottom:14px;}
    .kpi{ font-size:52px; font-weight:900; }
    .pill{ display:inline-block; padding:6px 10px; border-radius:999px;
           background:#0b1220; border:1px solid var(--border); margin:4px;}
    .btn{ border:1px solid #0ea5e9; background:#0ea5e922; padding:8px 12px;
          border-radius:12px; cursor:pointer; color:var(--text);}
    .footer{
      position:fixed; bottom:0; left:0; right:0;
      background:#0b0f14; border-top:1px solid var(--border);
      padding:10px; display:flex; justify-content:space-between;
      font-size:13px; color:var(--muted);
    }
    .persona{
      display:flex; align-items:center; gap:10px;
      padding:10px; border-radius:12px;
      background:#0b1220; border:1px solid var(--border);
      margin-top:10px;
    }
    .persona-icon{
      font-size:22px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <div>Overkill Score</div>
    <div class="kpi" id="score">--</div>
    <div id="status"></div>
    <div id="roast" style="margin-top:10px;color:var(--muted)"></div>

    <div id="personaBox" class="persona">
      <div class="persona-icon" id="personaIcon">🧠</div>
      <div>
        <strong id="personaName">Persona</strong>
        <div style="font-size:13px;color:var(--muted)" id="personaDesc"></div>
      </div>
    </div>

    <div style="margin-top:12px;">
      <button class="btn" id="vibeBtn">New vibe</button>
      <button class="btn" id="excuseBtn">Generate excuse</button>
      <button class="btn" id="toggleRefreshBtn">Auto-refresh: ON</button>
    </div>

    <div style="margin-top:10px" id="excuse"></div>
  </div>

</div>

<div class="footer">
  <div>© <span id="year"></span> <a href="{{ github_url }}" target="_blank">GitHub</a></div>
  <div>Version {{ app_version }}</div>
</div>

<script>
let LAST = null;
const LS_EXCUSE = "oe_excuse_v1";
const LS_VIBE = "oe_vibe_v1";
const LS_AUTOREFRESH = "oe_autorefresh_v1";

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function saveLS(k,v){ localStorage.setItem(k,v); }
function loadLS(k,d=null){ return localStorage.getItem(k)||d; }

/* Persona selection logic */
function choosePersona(){
  if(!LAST) return PERSONAS[0];

  const score = LAST.overkill_score || 0;
  const running = LAST.docker?.containers_running || 0;
  const uptime = LAST.system?.uptime_days || 0;

  if(uptime > 30) return PERSONAS.find(p=>p.id==="uptime_maximalist");
  if(running > 20) return PERSONAS.find(p=>p.id==="compose_archaeologist");
  if(score > 75) return PERSONAS.find(p=>p.id==="rack_philosopher");
  if(running > 5) return PERSONAS.find(p=>p.id==="yaml_sorcerer");

  return pick(PERSONAS);
}

function renderPersona(){
  const p = choosePersona();
  document.getElementById("personaIcon").textContent = p.icon;
  document.getElementById("personaName").textContent = p.name;
  document.getElementById("personaDesc").textContent = p.description;
}

function generateExcuse(){
  return pick(EXCUSES);
}

function applyVibe(){
  const roast = pick(LOCAL_ROASTS);
  const flavor = " · " + pick(FLAVOR_TAGS);
  document.getElementById("roast").textContent = roast + flavor;
  saveLS(LS_VIBE, roast + flavor);
}

async function loadStatus(){
  const res = await fetch('status',{cache:'no-store'});
  const data = await res.json();
  LAST = data;

  document.getElementById("score").textContent = data.overkill_score;
  document.getElementById("status").textContent = data.status;

  if(!loadLS(LS_VIBE)){
    applyVibe();
  } else {
    document.getElementById("roast").textContent = loadLS(LS_VIBE);
  }

  renderPersona();
}

document.getElementById("vibeBtn").onclick=applyVibe;

document.getElementById("excuseBtn").onclick=()=>{
  const e = generateExcuse();
  document.getElementById("excuse").textContent=e;
  saveLS(LS_EXCUSE,e);
};

document.getElementById("toggleRefreshBtn").onclick=()=>{
  const enabled = loadLS(LS_AUTOREFRESH,"1")==="1";
  saveLS(LS_AUTOREFRESH, enabled?"0":"1");
  location.reload();
};

document.getElementById("year").textContent=new Date().getFullYear();

const savedExcuse=loadLS(LS_EXCUSE);
if(savedExcuse) document.getElementById("excuse").textContent=savedExcuse;

loadStatus();
</script>

</body>
</html>
