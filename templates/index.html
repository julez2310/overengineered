<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overengineered</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
           background:#0b0f14; color:#e7eef7; margin:0; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px; }
    .grid { display:grid; gap:14px; grid-template-columns: repeat(12, 1fr); }
    .card { background:#111827; border:1px solid #1f2937; border-radius:16px; padding:16px; }
    .hero { grid-column: span 12; }
    .half { grid-column: span 6; }
    @media (max-width: 900px){ .half{ grid-column: span 12; } }
    .kpi { font-size: 52px; font-weight: 800; letter-spacing:-0.04em; }
    .label { opacity: 0.85; }
    .muted { opacity: 0.75; }
    .btn { background:#0ea5e9; color:#001018; border:0; border-radius:12px;
           padding:10px 14px; font-weight:700; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px;
            background:#0b1220; border:1px solid #1f2937; margin-right:6px; margin-top:6px; }
    pre { white-space: pre-wrap; word-break: break-word; background:#0b1220; border:1px solid #1f2937;
          border-radius:12px; padding:12px; margin:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="card hero">
        <div class="label">OVERKILL SCORE</div>
        <div class="kpi" id="score">--</div>
        <div class="label">STATUS: <span id="status">---</span></div>
        <p class="muted" id="roast">loading roast...</p>

        <button class="btn" id="roastBtn">Roast me harder</button>

        <div style="margin-top:10px">
          <span class="pill" id="dockerPill">Docker: ...</span>
          <span class="pill" id="uptimePill">Uptime: ...</span>
        </div>
      </div>

      <div class="card half">
        <div class="label">SYSTEM</div>
        <div id="sys"></div>
      </div>

      <div class="card half">
        <div class="label">WHAT COULD IT DO?</div>
        <div id="could"></div>
      </div>

      <div class="card hero">
        <div class="label">RAW JSON</div>
        <pre id="raw"></pre>
      </div>
    </div>
  </div>

<script>
async function loadStatus() {
  const res = await fetch('status', { cache: 'no-store' }); // relative path = proxy-friendly
  const data = await res.json();

  document.getElementById('score').textContent = data.overkill_score;
  document.getElementById('status').textContent = data.status;
  document.getElementById('roast').textContent = data.roast;

  const d = data.docker?.available
    ? `Docker: ${data.docker.containers_running} running / ${data.docker.containers_total} total`
    : `Docker: unavailable`;
  document.getElementById('dockerPill').textContent = d;

  document.getElementById('uptimePill').textContent = `Uptime: ${data.system.uptime_days}d`;

  document.getElementById('sys').innerHTML = `
    <div class="pill">CPU: ${data.system.cpu_percent}%</div>
    <div class="pill">Cores: ${data.system.cpu_cores_logical}</div>
    <div class="pill">RAM: ${data.system.ram_used_gb} / ${data.system.ram_total_gb} GB (${data.system.ram_percent}%)</div>
  `;

  document.getElementById('could').innerHTML = data.what_could_it_do.could_run
    .map(x => `<div class="pill">${x}</div>`)
    .join('');

  document.getElementById('raw').textContent = JSON.stringify(data, null, 2);
}

document.getElementById('roastBtn').addEventListener('click', loadStatus);
loadStatus();
</script>
</body>
</html>
